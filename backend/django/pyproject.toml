[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*/migrations/*", "venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "DJ",  # flake8-django
]

[tool.ruff.lint.isort]
known-first-party = ["config", "tasks"]
